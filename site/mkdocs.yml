site_name: tide
site_description: 마일스톤 → 구현 → 리뷰 → 릴리즈 개발 사이클을 프로젝트 독립적인 Claude Code 슬래시 커맨드로 구현한 워크플로우
site_url: https://Jongh.github.io/tide/
repo_url: https://github.com/Jongh/tide
repo_name: Jongh/tide

docs_dir: docs
site_dir: _build

theme:
  name: material
  language: ko
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: 다크 모드로 전환
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: 라이트 모드로 전환
  icon:
    repo: fontawesome/brands/github

nav:
  - 홈: index.md
  - 시작하기: getting-started.md
  - 개념: concepts.md
  - 커맨드 레퍼런스: commands.md
  - 규약: conventions.md
  - 변경 이력: changelog.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Jongh/tide
