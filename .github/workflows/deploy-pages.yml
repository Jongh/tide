name: Deploy docs site to GitHub Pages

on:
  push:
    # paths 필터 없이 main 푸시마다 빌드·배포한다. 사이트가 단일 원본으로 인클루드하는
    # 루트 파일(CHANGELOG.md·docs/conventions.md 등)이 늘어도 허용목록 누락으로 사이트가
    # 낡을 위험이 없도록 main 전체를 트리거로 둔다(사이트 빌드가 ~1초로 가벼워 비용 무시 가능).
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: site/requirements.txt
      - run: pip install -r site/requirements.txt
      - run: mkdocs build -f site/mkdocs.yml --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
