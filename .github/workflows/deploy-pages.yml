name: Deploy docs site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-pages.yml"
      # 사이트가 pymdownx.snippets로 단일 원본 인클루드하는 루트 파일들 —
      # 이들이 바뀌면 사이트 콘텐츠(변경 이력·규약)도 바뀌므로 재배포가 필요하다.
      # (이 항목이 없으면 CHANGELOG/conventions만 바뀐 릴리즈에서 사이트가 낡는다)
      - "CHANGELOG.md"
      - "docs/conventions.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: site/requirements.txt
      - run: pip install -r site/requirements.txt
      - run: mkdocs build -f site/mkdocs.yml --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
