name: tests

# Runtime matrix for the test harnesses (M37-T07).
#
# Why this file exists: until M37 rework 4 there was NO test workflow here -- `.github/workflows/`
# held only the mkdocs deploy. Every "PASS n FAIL 0" in seven review rounds was produced locally, by
# hand, on a runtime nobody had declared. That is how the M37 rework 3 blocker survived four rounds:
# `tests/discover/run.ps1` aborted on Windows PowerShell 5.1 -- the runtime its own first line
# declares -- ran 34 of 85 cases, printed its success banner and exited 0, while every measurement
# was being taken under `pwsh` 7.
#
# So the PowerShell runtime is an explicit matrix axis, not an implementation detail. On GitHub's
# windows runners `powershell` IS Windows PowerShell 5.1 and `pwsh` is PowerShell 7.
#
# Three things this file must NOT do, all learned the hard way in the M37 rework 4 review/release:
#   1. It must not enumerate the harnesses. A hardcoded list is a second declaration of the roster:
#      add a seventh harness and CI stays green while never running it -- green-because-we-looked-less,
#      the exact `vacuous-pass` class this milestone exists to kill. The list is DISCOVERED from the
#      filesystem, and discovering zero is a failure, not a pass.
#   2. It must not assume the working directory survives a harness. `tests/fleet-verify/run.ps1`
#      leaves the process CWD in the temp folder (its cleanup does `Set-Location`), so a loop running
#      the harnesses IN-PROCESS dies on the harness after it. Every harness is launched as its own
#      child process below, which also keeps GitHub's injected `$ErrorActionPreference` out of them.
#   3. It must not put `${{ }}` in `shell:`. The first version of this file used
#      `shell: ${{ matrix.shell }}` and GitHub refused to compile the workflow -- no jobs were created
#      at all, and the run reported only "workflow file issue". Local YAML validity is not GitHub
#      workflow validity; only a real push proves this file. The matrix runtime now reaches the step
#      through `env:` (expressions are fine there) and `shell:` stays a literal.
#   4. It must not launch a `run.ps1` from Git Bash. `tests/multi-repo/run.ps1` fails when started
#      from a Git Bash host but passes from a native PowerShell host (a BOM/launch-context
#      sensitivity now DIAGNOSED and ENFORCED -- M38-T05: that runner probes its own stdin byte
#      channel at startup and refuses loudly outside the supported context, instead of silently
#      scoring 29/1). So the PowerShell job's host shell is `pwsh` and only the CHILD process
#      varies across the matrix.
#
# The `pairing` job (M38-T02) closes the other half of point 1. The two runner jobs each DISCOVER
# their own harness set, and until now nobody asked whether the two sets were the same: drop a
# `tests/seventh/run.sh` with no `run.ps1` next to it and the PowerShell job stays green while never
# running it. Discovering zero is already a failure; discovering a DIFFERENT set was not. The M37
# review graded this minor and left a `precedent-waiver`; this job closes that waiver.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        ps: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - name: discover and run every run.ps1 harness
        shell: pwsh
        env:
          PS_EXE: ${{ matrix.ps }}
        run: |
          $root = $PWD.Path
          $harnesses = @(Get-ChildItem (Join-Path $root 'tests') -Directory |
              Where-Object { Test-Path (Join-Path $_.FullName 'run.ps1') } |
              Sort-Object Name)
          if ($harnesses.Count -eq 0) {
              Write-Host "no run.ps1 harness discovered under tests/ -- refusing to pass"
              exit 1
          }
          Write-Host "runtime: $env:PS_EXE -- discovered $($harnesses.Count): $(($harnesses | ForEach-Object { $_.Name }) -join ', ')"
          $failed = @()
          foreach ($h in $harnesses) {
              Write-Host "::group::$($h.Name)"
              & $env:PS_EXE -NoProfile -File (Join-Path $h.FullName 'run.ps1')
              $code = $LASTEXITCODE
              Write-Host "::endgroup::"
              if ($code -ne 0) { $failed += "$($h.Name) (exit $code)" }
          }
          if ($failed.Count -gt 0) {
              Write-Host "FAILED: $($failed -join ', ')"
              exit 1
          }
          Write-Host "all $($harnesses.Count) harnesses passed"

  # The `external-tool` axis (M40): sed/awk/grep are not one implementation. ubuntu carries GNU tools,
  # macOS carries BSD ones, and the same script can pass on one and silently differ on the other --
  # M37's release already caught one place where "ubuntu passed" only because GNU sed happened to
  # cover for it. The macOS leg is what enforces that axis; it is a matrix leg of THIS job, so the
  # job key stays `posix` and the axis table needs no new `job:` token.
  # NOTE (honesty): a leg that is added but allowed to fail (continue-on-error) or that skips cases
  # would be the `vacuous-pass` class -- a job that runs and is ignored. If a BSD failure cannot be
  # closed, the leg is REMOVED and the axis goes back to "unenforced" with the measured reason.
  posix:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: discover and run every run.sh harness
        shell: bash
        run: |
          root="$PWD"
          found=0
          failed=""
          for d in "$root"/tests/*/; do
              [ -f "$d/run.sh" ] || continue
              t=$(basename "$d")
              found=$((found + 1))
              echo "::group::$t"
              if ! ( cd "$root" && sh "$d/run.sh" ); then failed="$failed $t"; fi
              echo "::endgroup::"
          done
          if [ "$found" -eq 0 ]; then
              echo "no run.sh harness discovered under tests/ -- refusing to pass"
              exit 1
          fi
          echo "discovered $found harnesses"
          if [ -n "$failed" ]; then echo "FAILED:$failed"; exit 1; fi
          echo "all $found harnesses passed"

  # Cross-check the two jobs' harness sets. A harness with only one of the two runners is invisible
  # to the OTHER job, which stays green while never running it -- the `vacuous-pass` class. This job
  # only DISCOVERS (no runner is executed), so it is fast; it hardcodes no roster, and it names the
  # harness that is missing a side, because "the sets differ" is not actionable on its own.
  pairing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cross-check run.sh and run.ps1 harness sets
        shell: bash
        run: |
          # NOTE: GitHub's bash runs with `set -e`, so no trailing `[ ... ] && cmd` (a false test
          # would kill the step). Everything below is explicit if/then. `tests/lib` legitimately has
          # neither runner and must not be reported -- only directories with EXACTLY ONE are.
          sh_n=0; ps_n=0; sh_only=""; ps_only=""
          for d in "$PWD"/tests/*/; do
              t=$(basename "$d")
              has_sh=0; has_ps=0
              if [ -f "$d/run.sh" ]; then has_sh=1; sh_n=$((sh_n + 1)); fi
              if [ -f "$d/run.ps1" ]; then has_ps=1; ps_n=$((ps_n + 1)); fi
              if [ "$has_sh" -eq 1 ] && [ "$has_ps" -eq 0 ]; then sh_only="$sh_only $t"; fi
              if [ "$has_ps" -eq 1 ] && [ "$has_sh" -eq 0 ]; then ps_only="$ps_only $t"; fi
          done
          echo "run.sh harnesses: $sh_n / run.ps1 harnesses: $ps_n"
          if [ "$sh_n" -eq 0 ] || [ "$ps_n" -eq 0 ]; then
              echo "a runner side discovered ZERO harnesses under tests/ -- refusing to pass"
              exit 1
          fi
          rc=0
          if [ -n "$sh_only" ]; then
              echo "MISSING run.ps1 (the PowerShell job never runs these):$sh_only"
              rc=1
          fi
          if [ -n "$ps_only" ]; then
              echo "MISSING run.sh (the posix job never runs these):$ps_only"
              rc=1
          fi
          if [ "$rc" -ne 0 ]; then
              echo "harness sets differ -- every harness needs both run.sh and run.ps1"
              exit 1
          fi
          echo "paired: all $sh_n harnesses carry both run.sh and run.ps1"
